# Rate-limit zone for the GitHub deploy webhook endpoint.
# Legit traffic per deployment: ~3 events (pending/in_progress/success),
# rarely more than a few deployments per minute. 1r/s with a burst of 20
# absorbs those bursts, but bounds the cost of invalid requests: every
# request spawns a python interpreter, even with an invalid signature.
limit_req_zone $binary_remote_addr zone=deploywebhook:10m rate=1r/s;
