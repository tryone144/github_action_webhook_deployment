# GitHub deploy webhook: hand off requests to the deploywebhookgithub CGI
# script. vhost-agnostic, include inside a TLS-enabled server block:
#
#     include snippets/deploywebhookgithub.conf;
#
# Requires the rate-limit zone from conf.d/deploywebhookgithub-ratelimit.conf
# and the fcgiwrap socket at /run/fcgiwrap.socket (see README).

location = /deploy {
    # reject other methods before spawning the CGI process
    if ($request_method != POST) {
        return 405;
    }

    # matches the request body limit enforced by the CGI script (MAX_BODY_SIZE)
    client_max_body_size 1m;

    # the CGI script verifies the HMAC signature, this only bounds the
    # per-client cost of invalid requests
    limit_req zone=deploywebhook burst=20 nodelay;
    limit_req_status 429;

    # the CGI script replies within ~1s (it detaches the deployment script
    # in the background); github gives up after 10s, so do not hold longer
    fastcgi_read_timeout 10s;

    fastcgi_param SCRIPT_FILENAME /usr/local/sbin/deploywebhookgithub;
    fastcgi_pass unix:/run/fcgiwrap.socket;
    include fastcgi_params;
    fastcgi_ignore_client_abort on;
}
